  #   volumes:
  #     - ./openchat/volume:/app/volume
  #   restart: always
  wol:
    build: ./wol
    container_name: "wol"
    ports:
      - 8516:5000
    volumes:
      - ./wol/volume:/app/volume
      - ./wol/images:/app/images
    restart: always
