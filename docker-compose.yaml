  #  build: ./uses
  #  container_name: "uses"
  #  ports:
  #    - 8082:80
  #  restart: always
  deh:
    build: ./de-book
    container_name: "deh"
    ports:
      - 8580:8000
    restart: always
  #focus:
  # build: ./bubble-typing
  # container_name: "focus"
  # ports:
  #   - 8555:80
  # restart: always
  utils:
    build: ./utils
    container_name: "utils"
    ports:
      - 8001:5001
    volumes:
      - ./utils/volume:/app/volume
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
  # openchat:
